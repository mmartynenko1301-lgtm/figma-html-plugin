<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font: 12px/1.4 Inter, system-ui, sans-serif; color: var(--figma-color-text, #222); background: var(--figma-color-bg, #fff); }
  main { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  h1 { font-size: 13px; font-weight: 600; margin: 0; }
  label { display: flex; flex-direction: column; gap: 4px; color: var(--figma-color-text-secondary, #666); }
  input, select { font: inherit; padding: 6px 8px; border: 1px solid var(--figma-color-border, #ddd); border-radius: 6px; background: transparent; color: inherit; }
  button { font: inherit; font-weight: 600; padding: 8px; border: 0; border-radius: 6px; cursor: pointer; background: var(--figma-color-bg-brand, #0d99ff); color: var(--figma-color-text-onbrand, #fff); }
  button:disabled { opacity: .4; cursor: default; }
  .muted { color: var(--figma-color-text-secondary, #666); }
  .preview { border: 1px solid var(--figma-color-border, #ddd); border-radius: 6px; overflow: auto; max-height: 300px; background: repeating-conic-gradient(#eee 0 25%, #fff 0 50%) 0 0/16px 16px; }
  .preview iframe { border: 0; display: block; transform-origin: 0 0; }
  ul { margin: 0; padding-left: 16px; }
  .error { color: var(--figma-color-text-danger, #d33); }
</style>
</head>
<body>
<main>
  <h1>Експорт банера в HTML5</h1>
  <label>Фрейм
    <select id="frame"></select>
  </label>
  <label>Посилання (clickTag)
    <input id="clicktag" type="url" value="https://example.com">
  </label>
  <button id="export" disabled>Експортувати ZIP</button>
  <div id="status" class="muted">Виділіть фрейм банера.</div>
  <div class="preview" id="preview" hidden></div>
  <ul id="warnings" class="muted"></ul>
</main>
<!-- SCRIPT -->
</body>
</html>
