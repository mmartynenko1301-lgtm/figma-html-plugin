<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<style>
  :root { --text: var(--figma-color-text, #222); --muted: var(--figma-color-text-secondary, #777); --border: var(--figma-color-border, #e2e2e2); --bg: var(--figma-color-bg, #fff); --bg2: var(--figma-color-bg-secondary, #f5f5f5); --brand: var(--figma-color-bg-brand, #0d99ff); --onbrand: var(--figma-color-text-onbrand, #fff); --danger: var(--figma-color-text-danger, #d33); --warn: var(--figma-color-text-warning, #b86200); --sel: var(--figma-color-bg-selected, #e5f4ff); }
  * { box-sizing: border-box; }
  body { margin: 0; font: 12px/1.4 Inter, system-ui, sans-serif; color: var(--text); background: var(--bg); }
  main { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  h1 { font-size: 13px; font-weight: 600; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  h2 { font-size: 12px; font-weight: 600; margin: 0 0 6px; }
  section { border-top: 1px solid var(--border); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  label { display: flex; flex-direction: column; gap: 3px; color: var(--muted); }
  label.check { flex-direction: row; align-items: center; gap: 6px; color: var(--text); }
  input, select { font: inherit; padding: 5px 7px; border: 1px solid var(--border); border-radius: 5px; background: var(--bg); color: var(--text); min-width: 0; }
  button { font: inherit; font-weight: 600; padding: 8px; border: 0; border-radius: 6px; cursor: pointer; background: var(--brand); color: var(--onbrand); }
  button.secondary { background: var(--bg2); color: var(--text); font-weight: 500; flex: 1; }
  button.link { background: none; color: var(--brand); padding: 0; text-align: left; font-weight: 500; }
  button:disabled { opacity: .4; cursor: default; }
  .row { display: flex; gap: 8px; }
  .row.between { justify-content: space-between; align-items: baseline; }
  .row.between h2 { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.tight { gap: 10px; flex: none; }
  .muted { color: var(--muted); margin: 0; }
  .small { font-size: 11px; }
  .error { color: var(--danger); margin: 0; }
  ul { margin: 0; padding-left: 16px; }
  .preview { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: repeating-conic-gradient(#eee 0 25%, #fff 0 50%) 0 0/16px 16px; display: flex; justify-content: center; }
  .preview.empty { height: 120px; align-items: center; background: var(--bg2); }
  .preview iframe { border: 0; display: block; transform-origin: 0 0; flex: none; }
  .layers { list-style: none; padding: 0; max-height: 220px; overflow: auto; border: 1px solid var(--border); border-radius: 6px; }
  .layers li { display: flex; align-items: center; gap: 4px; padding: 4px 8px; cursor: pointer; }
  .layers li:hover { background: var(--bg2); }
  .layers li.selected { background: var(--sel); }
  .layers .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 10px; padding: 1px 5px; border-radius: 8px; background: var(--bg2); color: var(--muted); }
  .badge.warn { color: var(--warn); }
  fieldset { min-width: 0; border: 1px solid var(--border); border-radius: 6px; padding: 8px; margin: 0; display: flex; flex-direction: column; gap: 8px; }
  legend { font-weight: 600; padding: 0 4px; }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
  input:not([type=checkbox]), select { width: 100%; }
  button.fit { flex: none; }
  .link-file { color: var(--brand); font-weight: 500; cursor: pointer; display: inline; }
  .link-file input { display: none; }
  .keyframes { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .keyframes th { font-weight: 500; color: var(--muted); text-align: left; font-size: 10px; padding: 0 2px 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .keyframes th:last-child, .keyframes td:last-child { width: 18px; }
  .keyframes td { padding: 1px; }
  .keyframes input { padding: 3px; font-size: 11px; }
  .timeline { border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; display: flex; flex-direction: column; gap: 3px; }
  .tl-row { display: flex; align-items: center; gap: 6px; min-height: 13px; }
  .tl-row.selected .tl-name { color: var(--brand); font-weight: 600; }
  .tl-name { width: 80px; flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
  .tl-track { position: relative; flex: 1; height: 100%; background: var(--bg2); border-radius: 3px; }
  .tl-axis .tl-track { background: none; }
  .tl-tick { position: absolute; top: 0; transform: translateX(-50%); font-size: 9px; color: var(--muted); }
  .tl-tick:first-child { transform: none; }
  .tl-limit { position: absolute; top: 0; bottom: 0; border-left: 1px dashed var(--danger); }
  .tl-bar { position: absolute; border-radius: 2px; cursor: ew-resize; touch-action: none; }
  .tl-bar.intro { background: #0d99ff; }
  .tl-bar.custom { background: #9747ff; }
  .tl-bar.loop { background: #14ae5c; }
  .tl-bar.outro { background: #f24822; }
  .tl-playhead { position: absolute; top: 0; bottom: 0; left: 0; border-left: 1px solid var(--text); pointer-events: none; animation: tl-play linear forwards; }
  @keyframes tl-play { from { left: 0; } to { left: 100%; } }
</style>
</head>
<body>
<div id="app"></div>
<!-- SCRIPT -->
</body>
</html>
